name: Deploy to EC2

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: devops-release-demo
  ECR_REGISTRY: 596234624782.dkr.ecr.us-east-1.amazonaws.com

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::596234624782:role/GitHubActionsRole
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t $ECR_REPOSITORY:latest .

      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:latest \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Push Docker Image
        run: |
          docker push \
          $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 596234624782.dkr.ecr.us-east-1.amazonaws.com

            docker pull 596234624782.dkr.ecr.us-east-1.amazonaws.com/devops-release-demo:latest

            docker stop devops-release-demo || true
            docker rm devops-release-demo || true

            docker run -d \
              --restart unless-stopped \
              --name devops-release-demo \
              -p 80:3000 \
              596234624782.dkr.ecr.us-east-1.amazonaws.com/devops-release-demo:latest
